
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Játékos matematika</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf5fc;
  color: #23445c;
}
header {
  background: linear-gradient(135deg,#087da9,#20b6c5);
  color: white;
  text-align: center;
  padding: 40px 15px;
}
header h1 { font-size: 34px; margin: 0 0 10px; }
main {
  max-width: 850px;
  margin: 30px auto;
  padding: 15px;
}
h2 { text-align: center; }
.game {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin: 18px 0;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: 0 3px 12px #0001;
}
.emoji { font-size: 55px; }
.game h3 { margin: 0 0 8px; }
a {
  display: inline-block;
  background: #087da9;
  color: white;
  text-decoration: none;
  padding: 11px 20px;
  border-radius: 12px;
  font-weight: bold;
}
a:hover { background: #075b7c; }
footer {
  text-align: center;
  padding: 25px;
  color: #567;
}

<body>
<header>
  <h1>🎮 Játékos matematika</h1>
  <p>Játssz, gyakorolj, ügyesedj!</p>
</header>

<main>
  <h2>Válassz egy játékot!</h2>

  <div class="game">
    <div class="emoji">🐊</div>
    <div>
      <h3>Falánk krokodil</h3>
      <p>Számok összehasonlítása – melyik a több?</p>
      <a href="falank_krokodil.html">Játék indítása</a>
    </div>
  </div>

  <div class="game">
    <div class="emoji">➕</div>
    <div>
      <h3>Írásbeli műveletek</h3>
      <p>Hamarosan új gyakorlójáték!</p>
    </div>
  </div>

</main>

<footer>
  Készítette: Fodorné Varkoly Mária
</footer>
</body>
</html>
